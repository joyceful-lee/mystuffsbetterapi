name: Check application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-only placeholders. Unit tests and compilation never use live Neon.
      NEON_AUTH_BASE_URL: https://example.invalid/neonauth
      NEON_AUTH_COOKIE_SECRET: ci-only-placeholder-secret-at-least-32-characters
      APP_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
